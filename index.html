<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الماجيكو فى الرياضيات - أ. محمد أحمد</title>
    <link rel="stylesheet" href="assets/tailwind.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/common.js"></script>
</head>
<body class="text-gray-800 min-h-screen pb-24 relative">

    <header class="fixed top-0 w-full bg-white/95 backdrop-blur-md shadow-sm z-40 h-20 flex items-center px-4 md:px-8 border-b border-blue-100">
        <img src="logo.jpeg" alt="Logo" class="w-14 h-14 md:w-16 md:h-16 rounded-xl shadow-sm object-cover border border-yellow-300 bg-white">
        <h1 class="mr-4 font-extrabold text-blue-900 text-lg md:text-2xl drop-shadow-sm">الماجيكو فى الرياضيات</h1>
    </header>
    <div class="fixed top-20 w-full z-40 brand-strip"></div>

    <div class="max-w-4xl mx-auto p-4 relative pt-28">
        <div class="space-y-6">
            <div class="glass-panel rounded-2xl p-6 shadow-lg relative overflow-hidden flex flex-col md:flex-row items-center gap-6 mt-4">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-200 rounded-full opacity-60 blur-xl"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-200 rounded-full opacity-60 blur-xl"></div>
                <div class="w-full md:w-1/2 text-center md:text-right z-10 flex flex-col justify-center">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-700 mb-2">الرياضيات - الصف الأول الإعدادى</h2>
                    <h3 class="text-xl md:text-2xl text-blue-700 font-extrabold mb-2">الفصل الدراسى الأول</h3>
                    <p class="text-gray-500 font-bold">16 درسًا × 6 ألعاب تفاعلية لكل درس</p>
                    <div class="mt-4 border-t border-blue-100 pt-4">
                        <p class="text-sm text-gray-500 font-bold">مع الأستاذ</p>
                        <p class="text-3xl font-extrabold text-blue-900">محمد أحمد</p>
                        <p class="text-lg font-extrabold text-yellow-600"><i class="fa-solid fa-crown"></i> الماجيكو فى الرياضيات</p>
                    </div>
                </div>
                <div class="w-full md:w-1/2 z-10 flex justify-center md:justify-end">
                    <img src="pic.jpeg" alt="أ. محمد أحمد" class="w-48 h-48 sm:w-64 sm:h-64 md:w-full md:max-w-[300px] aspect-square rounded-2xl border-4 border-yellow-400 shadow-xl object-cover bg-blue-50">
                </div>
            </div>

            <h3 class="text-center font-bold text-gray-600 mt-8 mb-4 text-lg">اختر الفرع لتبدأ التحدى</h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5" id="branches"></div>

            <div class="glass-panel rounded-2xl p-5 text-center mt-8">
                <p class="font-bold text-gray-600 mb-2">للحجز والاستفسار واتس اب على الرقم</p>
                <a href="https://wa.me/201145482121" target="_blank" class="inline-flex items-center gap-2 text-2xl font-extrabold text-blue-900 bg-yellow-300 px-6 py-2 rounded-xl shadow btn-bounce">
                    <i class="fa-brands fa-whatsapp text-green-600"></i> <span dir="ltr">01145482121</span>
                </a>
                <p class="mt-3 text-yellow-600 font-extrabold">معًا نحو التفوق</p>
            </div>
        </div>
    </div>

    <a href="https://wa.me/201145482121" target="_blank" class="fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:bg-green-600 hover:scale-110 transition-all btn-bounce border-2 border-white z-40">
        <i class="fa-brands fa-whatsapp text-3xl"></i>
    </a>

    <script>
        const box = document.getElementById('branches');
        Object.keys(BRANCHES).forEach(k => {
            const b = BRANCHES[k];
            const count = b.groups.reduce((n, g) => n + g.lessons.length, 0);
            box.insertAdjacentHTML('beforeend', `
            <a href="${b.file}" class="btn-bounce bg-gradient-to-l ${b.color} text-white p-6 rounded-2xl shadow-lg flex items-center justify-between min-h-[130px] hover:shadow-2xl">
                <div class="text-right">
                    <p class="text-xs font-bold text-white/80 mb-1">${b.unit}</p>
                    <h4 class="font-extrabold text-2xl mb-1">${b.name}</h4>
                    <p class="text-sm text-white/90"><i class="fa-solid fa-gamepad"></i> ${count} ${count > 2 ? 'دروس' : 'درس'} - ${count * 6} لعبة</p>
                </div>
                <i class="fa-solid ${b.icon} text-5xl opacity-80"></i>
            </a>`);
        });
    </script>
</body>
</html>
